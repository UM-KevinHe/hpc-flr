name: wheels

# Build the paraflr Python package as self-contained wheels for
# Windows / macOS / Linux, so users can `pip install` a prebuilt binary
# instead of compiling from source. cibuildwheel runs the build on real
# runners of each OS; the wheels bundle their own BLAS/LAPACK, so the end
# user needs no compiler, no Armadillo, and no BLAS.
#
# Trigger it from the Actions tab ("Run workflow"), or by pushing a version
# tag (`git tag v0.1.0 && git push origin v0.1.0`). A tag push also attaches
# every wheel to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false     # one OS failing must not cancel the others' wheels
      matrix:
        # No macos-13: the Intel-Mac runners are scarce and can queue for hours.
        # The Apple-Silicon runner (macos-14) cross-builds the x86_64 wheel too.
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Windows has no system package manager for these, and cibuildwheel's
      # before_all shell does not reliably have `python` on PATH — so fetch the
      # Windows build deps here, on the host, with a shell and python we control.
      # Windows wheels build on the host (not a container), so C:/deps persists.
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Fetch Windows build deps (Armadillo headers + OpenBLAS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python paraflr-py/tools/fetch_armadillo.py C:/deps/arma
          python paraflr-py/tools/fetch_openblas_windows.py C:/deps/openblas
          # Put the OpenBLAS DLL dir on PATH so the wheel-repair step
          # (delvewheel) finds libopenblas.dll and bundles it into the wheel.
          echo "C:/deps/openblas/bin" >> "$GITHUB_PATH"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: paraflr-py
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-musllinux* *_i686 pp*"
          # 64-bit only: the downloaded OpenBLAS is x64, and 32-bit Windows is
          # obsolete. Without this cibuildwheel also tries cp3x-win32 and fails.
          CIBW_ARCHS_WINDOWS: AMD64

          # --- Linux: AlmaLinux 8 image (manylinux2014/CentOS 7 is EOL, its
          #     package mirrors are dead). Armadillo headers + OpenBLAS
          #     (BLAS+LAPACK) both come from the package manager — no download,
          #     no `python` needed in this step.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BEFORE_ALL_LINUX: >
            dnf install -y epel-release &&
            dnf install -y armadillo-devel openblas-devel
          CIBW_ENVIRONMENT_LINUX: PARAFLR_BLAS_LIBS=openblas

          # --- macOS: Armadillo headers from Homebrew, BLAS/LAPACK from the
          #     Accelerate framework (universal). The Apple-Silicon runner
          #     cross-builds BOTH arches, so users on Intel and Apple Silicon
          #     both get a wheel.
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_BEFORE_ALL_MACOS: brew install armadillo
          CIBW_ENVIRONMENT_MACOS: PARAFLR_BLAS_FRAMEWORK=Accelerate

          # --- Windows: deps were fetched to C:/deps by the host step above,
          #     and C:/deps/openblas/bin is on PATH so cibuildwheel's default
          #     delvewheel repair finds and bundles libopenblas.dll.
          CIBW_ENVIRONMENT_WINDOWS: >
            PARAFLR_ARMADILLO_INCLUDE=C:/deps/arma/include
            PARAFLR_BLAS_INCLUDE=C:/deps/openblas/include
            PARAFLR_BLAS_LIBDIR=C:/deps/openblas/lib
            PARAFLR_BLAS_LIBS=libopenblas

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    name: attach wheels to the release
    needs: build_wheels
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
